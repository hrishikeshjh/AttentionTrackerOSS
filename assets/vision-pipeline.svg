<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="50%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="gradBoxBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bc8cff" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="40" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="700">End-to-End Computer Vision &amp; Cognitive Attention Pipeline</text>
  <text x="550" y="65" text-anchor="middle" fill="#8b949e" font-size="13">From 60 FPS Raw Frames to Multi-Modal Behavioral Classification and Actuation</text>

  <!-- Flowchart Stages -->

  <!-- STAGE 1: INGESTION -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <rect width="180" height="420" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <path d="M 0 10 Q 0 0 10 0 L 170 0 Q 180 0 180 10 L 180 36 L 0 36 Z" fill="#1f6feb" fill-opacity="0.3" />
    <text x="90" y="24" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">STAGE 1: Ingestion</text>

    <rect x="15" y="55" width="150" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="78" fill="#e6edf3" font-size="12" font-weight="600">Video Feed</text>
    <text x="25" y="96" fill="#8b949e" font-size="10">Webcam / RTSP /</text>
    <text x="25" y="111" fill="#8b949e" font-size="10">CCTV Camera</text>

    <rect x="15" y="145" width="150" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="168" fill="#e6edf3" font-size="12" font-weight="600">Letterbox Preproc</text>
    <text x="25" y="186" fill="#8b949e" font-size="10">Uniform 640×640</text>
    <text x="25" y="201" fill="#8b949e" font-size="10">Aspect Preservation</text>

    <rect x="15" y="235" width="150" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="258" fill="#e6edf3" font-size="12" font-weight="600">Cadence Governor</text>
    <text x="25" y="276" fill="#8b949e" font-size="10">200 ms Fixed Loop</text>
    <text x="25" y="291" fill="#8b949e" font-size="10">(5 Hz Sample Rate)</text>

    <rect x="15" y="325" width="150" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="348" fill="#e6edf3" font-size="12" font-weight="600">Object Context</text>
    <text x="25" y="366" fill="#8b949e" font-size="10">Phone, Book, Cup</text>
    <text x="25" y="381" fill="#8b949e" font-size="10">EfficientDet / YOLO</text>
  </g>

  <!-- STAGE 2: LANDMARKS & TRACKING -->
  <g transform="translate(240, 95)" filter="url(#shadow)">
    <rect width="190" height="420" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <path d="M 0 10 Q 0 0 10 0 L 180 0 Q 190 0 190 10 L 190 36 L 0 36 Z" fill="#8957e5" fill-opacity="0.3" />
    <text x="95" y="24" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">STAGE 2: Tracking</text>

    <rect x="15" y="55" width="160" height="80" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="78" fill="#e6edf3" font-size="12" font-weight="600">ByteTrack 16</text>
    <text x="25" y="96" fill="#bc8cff" font-size="10">Kalman State Vector</text>
    <text x="25" y="111" fill="#8b949e" font-size="10">Multi-person BBox</text>
    <text x="25" y="126" fill="#8b949e" font-size="10">Persistent Track IDs</text>

    <rect x="15" y="150" width="160" height="80" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="173" fill="#e6edf3" font-size="12" font-weight="600">MediaPipe Mesh</text>
    <text x="25" y="191" fill="#bc8cff" font-size="10">468 / 478 3D Points</text>
    <text x="25" y="206" fill="#8b949e" font-size="10">Sub-pixel Iris Center</text>
    <text x="25" y="221" fill="#8b949e" font-size="10">Lip Contours &amp; Chin</text>

    <rect x="15" y="245" width="160" height="75" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="268" fill="#e6edf3" font-size="12" font-weight="600">MediaPipe Hands</text>
    <text x="25" y="286" fill="#bc8cff" font-size="10">21 3D Joint Knots</text>
    <text x="25" y="301" fill="#8b949e" font-size="10">Wrist &amp; Fingertip Pos</text>

    <rect x="15" y="335" width="160" height="65" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="358" fill="#e6edf3" font-size="12" font-weight="600">Absence Governor</text>
    <text x="25" y="376" fill="#8b949e" font-size="10">3.0s Grace Period</text>
    <text x="25" y="391" fill="#8b949e" font-size="10">Fallback to 'Idle' State</text>
  </g>

  <!-- STAGE 3: GEOMETRIC EXTRACTION -->
  <g transform="translate(460, 95)" filter="url(#shadow)">
    <rect width="200" height="420" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <path d="M 0 10 Q 0 0 10 0 L 190 0 Q 200 0 200 10 L 200 36 L 0 36 Z" fill="#bc8cff" fill-opacity="0.3" />
    <text x="100" y="24" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">STAGE 3: Biometrics</text>

    <rect x="15" y="55" width="170" height="80" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="78" fill="#f0f6fc" font-size="12" font-weight="600">EAR &amp; PERCLOS</text>
    <text x="25" y="96" fill="#bc8cff" font-size="10">EAR = ||p2-p6||+||p3-p5||</text>
    <text x="25" y="111" fill="#8b949e" font-size="10">           / (2·||p1-p4||)</text>
    <text x="25" y="126" fill="#8b949e" font-size="10">Blink &lt; 0.21 • 60s Buffer</text>

    <rect x="15" y="150" width="170" height="80" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="173" fill="#f0f6fc" font-size="12" font-weight="600">3D SolvePnP Pose</text>
    <text x="25" y="191" fill="#bc8cff" font-size="10">DACE Euler Matrix</text>
    <text x="25" y="206" fill="#8b949e" font-size="10">Pitch (–down), Yaw, Roll</text>
    <text x="25" y="221" fill="#8b949e" font-size="10">Fidget Velocity Score</text>

    <rect x="15" y="245" width="170" height="75" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="268" fill="#f0f6fc" font-size="12" font-weight="600">MAR (Mouth Ratio)</text>
    <text x="25" y="286" fill="#bc8cff" font-size="10">Vertical / Horizontal Gap</text>
    <text x="25" y="301" fill="#8b949e" font-size="10">Yawn &amp; Speech Flag</text>

    <rect x="15" y="335" width="170" height="65" rx="6" fill="#21262d" stroke="#8957e5" />
    <text x="25" y="358" fill="#f0f6fc" font-size="12" font-weight="600">Context-Gate Logic</text>
    <text x="25" y="376" fill="#bc8cff" font-size="10">Hand-to-Face Distance</text>
    <text x="25" y="391" fill="#8b949e" font-size="10">Reading Override</text>
  </g>

  <!-- STAGE 4: CLASSIFICATION & FUSION -->
  <g transform="translate(690, 95)" filter="url(#shadow)">
    <rect width="190" height="420" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <path d="M 0 10 Q 0 0 10 0 L 180 0 Q 190 0 190 10 L 190 36 L 0 36 Z" fill="#238636" fill-opacity="0.3" />
    <text x="95" y="24" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">STAGE 4: Inference</text>

    <rect x="15" y="55" width="160" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="78" fill="#e6edf3" font-size="12" font-weight="600">15-Dim Vector</text>
    <text x="25" y="96" fill="#3fb950" font-size="10">Standardized Contract</text>
    <text x="25" y="111" fill="#8b949e" font-size="10">Padded Posture State</text>

    <rect x="15" y="140" width="160" height="85" rx="6" fill="#21262d" stroke="#238636" />
    <text x="25" y="163" fill="#e6edf3" font-size="12" font-weight="600">Temporal 1D-CNN</text>
    <text x="25" y="181" fill="#3fb950" font-size="10">15-Frame Buffer (3 sec)</text>
    <text x="25" y="196" fill="#8b949e" font-size="10">Multi-Head Softmax</text>
    <text x="25" y="211" fill="#8b949e" font-size="10">Rule-Layer Fallback</text>

    <rect x="15" y="240" width="160" height="75" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="263" fill="#e6edf3" font-size="12" font-weight="600">EMA Smoothing</text>
    <text x="25" y="281" fill="#3fb950" font-size="10">α = 0.15 Smoother</text>
    <text x="25" y="296" fill="#8b949e" font-size="10">Removes Jitter Spikes</text>

    <rect x="15" y="330" width="160" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="353" fill="#e6edf3" font-size="12" font-weight="600">OLS Regression</text>
    <text x="25" y="371" fill="#3fb950" font-size="10">Slope β &lt; -0.4</text>
    <text x="25" y="386" fill="#8b949e" font-size="10">Fatigue Early Warning</text>
  </g>

  <!-- STAGE 5: ACTUATION & DISPATCH -->
  <g transform="translate(910, 95)" filter="url(#shadow)">
    <rect width="160" height="420" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <path d="M 0 10 Q 0 0 10 0 L 150 0 Q 160 0 160 10 L 160 36 L 0 36 Z" fill="#ffa657" fill-opacity="0.3" />
    <text x="80" y="24" fill="#ffa657" font-size="13" font-weight="700" text-anchor="middle">STAGE 5: Output</text>

    <rect x="15" y="55" width="130" height="80" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="78" fill="#e6edf3" font-size="12" font-weight="600">UI Dashboard</text>
    <text x="25" y="96" fill="#ffa657" font-size="10">Live Attention %</text>
    <text x="25" y="111" fill="#8b949e" font-size="10">SHAP Attributions</text>
    <text x="25" y="126" fill="#8b949e" font-size="10">Real-time Graphs</text>

    <rect x="15" y="150" width="130" height="80" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="173" fill="#e6edf3" font-size="12" font-weight="600">AI Report Gen</text>
    <text x="25" y="191" fill="#ffa657" font-size="10">Gemini 1.5/2.5</text>
    <text x="25" y="206" fill="#8b949e" font-size="10">Pedagogical Tips</text>
    <text x="25" y="221" fill="#8b949e" font-size="10">PDF Export Engine</text>

    <rect x="15" y="245" width="130" height="85" rx="6" fill="#21262d" stroke="#ffa657" />
    <text x="25" y="268" fill="#e6edf3" font-size="12" font-weight="600">ESP32 Actuator</text>
    <text x="25" y="286" fill="#ffa657" font-size="10">4-Relay Signals</text>
    <text x="25" y="301" fill="#8b949e" font-size="10">Light • Fan • Buzzer</text>
    <text x="25" y="316" fill="#8b949e" font-size="10">&lt; 25ms Response</text>

    <rect x="15" y="345" width="130" height="55" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="368" fill="#e6edf3" font-size="12" font-weight="600">Telemetry Stream</text>
    <text x="25" y="386" fill="#8b949e" font-size="10">JSON / WS / REST</text>
  </g>

  <!-- Connectors between Stages -->
  <path d="M 210 305 L 240 305" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M 430 305 L 460 305" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#arrowPurple)" />
  <path d="M 660 305 L 690 305" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#arrowPurple)" />
  <path d="M 880 305 L 910 305" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowGreen)" />

  <!-- Bottom Summary Timeline -->
  <g transform="translate(30, 540)" filter="url(#shadow)">
    <rect width="1040" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <text x="25" y="30" fill="#f0f6fc" font-size="13" font-weight="700">Pipeline Performance &amp; Hardware Budget</text>
    
    <text x="25" y="58" fill="#58a6ff" font-size="11" font-weight="600">Browser (Client Web / MV3 Extension):</text>
    <text x="260" y="58" fill="#8b949e" font-size="11">Inference: 18–35 ms/frame • Memory: &lt; 350 MB • Target: 5 Hz (200 ms cadence) • 0% Server Ingestion Load</text>

    <text x="25" y="80" fill="#3fb950" font-size="11" font-weight="600">Server (CCTV Multi-Person RTX 4090):</text>
    <text x="260" y="80" fill="#8b949e" font-size="11">Detection: 6.2 ms • ByteTrack: 1.8 ms • 20+ Simultaneous Tracked Persons @ 25 FPS • Total End-to-End Latency: &lt; 45 ms</text>
  </g>

  <!-- Footer -->
  <text x="550" y="665" text-anchor="middle" fill="#8b949e" font-size="11">AttentionTrackerOSS Pipeline • Developer: Hrishikesh Jha (@hrishikeshjh)</text>
</svg>
