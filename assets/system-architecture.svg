<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#8957e5" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa657" />
      <stop offset="100%" stop-color="#d29922" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffa657" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="42" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700" letter-spacing="0.5">AttentionTrackerOSS — Multi-Tier System Architecture</text>
  <text x="550" y="68" text-anchor="middle" fill="#8b949e" font-size="13">High-Performance Client-Side (v1.0), CCTV Edge-Server (v2.0) and Cyber-Physical Hardware Actuation Hub</text>

  <!-- TIER 1: CLIENT FRONTEND (v1.0) -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="310" height="250" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <rect width="310" height="38" rx="12" fill="url(#blueGrad)" fill-opacity="0.2" />
    <path d="M 0 12 Q 0 0 12 0 L 298 0 Q 310 0 310 12 L 310 38 L 0 38 Z" fill="url(#blueGrad)" fill-opacity="0.25" />
    <text x="20" y="25" fill="#58a6ff" font-size="15" font-weight="700">TIER 1: Browser Client (v1.0)</text>

    <!-- Sub-boxes -->
    <rect x="15" y="50" width="280" height="42" rx="6" fill="#21262d" stroke="#388bfd" stroke-width="1" />
    <text x="25" y="70" fill="#e6edf3" font-size="12" font-weight="600">Next.js 15 Web Application</text>
    <text x="25" y="84" fill="#8b949e" font-size="10">Webcam Capture • Turbopack • SSRF-Safe</text>

    <rect x="15" y="100" width="280" height="42" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="25" y="120" fill="#e6edf3" font-size="12" font-weight="600">Chrome MV3 Extension</text>
    <text x="25" y="134" fill="#8b949e" font-size="10">Tab &amp; Screen Tracking • HMAC Bridge • Session Storage</text>

    <rect x="15" y="150" width="280" height="42" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="25" y="170" fill="#e6edf3" font-size="12" font-weight="600">Browser In-Memory ML Core</text>
    <text x="25" y="184" fill="#8b949e" font-size="10">ONNX Runtime Web (WASM) • FaceMesh • EfficientDet</text>

    <rect x="15" y="200" width="280" height="36" rx="6" fill="#1f6feb" fill-opacity="0.15" stroke="#1f6feb" stroke-width="1" />
    <text x="25" y="222" fill="#58a6ff" font-size="11" font-weight="600">Client Output: Fixed 200ms Telemetry Stream</text>
  </g>

  <!-- TIER 2: SERVER BACKEND (v2.0) -->
  <g transform="translate(40, 380)" filter="url(#cardShadow)">
    <rect width="310" height="260" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 298 0 Q 310 0 310 12 L 310 38 L 0 38 Z" fill="url(#greenGrad)" fill-opacity="0.25" />
    <text x="20" y="25" fill="#3fb950" font-size="15" font-weight="700">TIER 2: CCTV Edge Server (v2.0)</text>

    <!-- Sub-boxes -->
    <rect x="15" y="50" width="280" height="42" rx="6" fill="#21262d" stroke="#238636" stroke-width="1" />
    <text x="25" y="70" fill="#e6edf3" font-size="12" font-weight="600">FastAPI Async Core</text>
    <text x="25" y="84" fill="#8b949e" font-size="10">X-API-Key Hardened • WebSocket / REST Telemetry</text>

    <rect x="15" y="100" width="280" height="42" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="25" y="120" fill="#e6edf3" font-size="12" font-weight="600">Multi-Stream CCTV Pipeline</text>
    <text x="25" y="134" fill="#8b949e" font-size="10">RTSP / WebRTC Ingestion • Auto-Reconnect Thread</text>

    <rect x="15" y="150" width="280" height="42" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="25" y="170" fill="#e6edf3" font-size="12" font-weight="600">YOLOv8 + ByteTrack 16 Engine</text>
    <text x="25" y="184" fill="#8b949e" font-size="10">Multi-Person Detection • Persistent ID Re-Association</text>

    <rect x="15" y="200" width="280" height="46" rx="6" fill="#238636" fill-opacity="0.15" stroke="#238636" stroke-width="1" />
    <text x="25" y="219" fill="#3fb950" font-size="11" font-weight="600">MediaPipe Multi-Face Mesh &amp; Hands</text>
    <text x="25" y="235" fill="#8b949e" font-size="10">Batch GPU / CPU Landmarker • Strict Posture Encoders</text>
  </g>

  <!-- TIER 3: MACHINE LEARNING & COGNITIVE ENGINE -->
  <g transform="translate(390, 95)" filter="url(#cardShadow)">
    <rect width="330" height="545" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 318 0 Q 330 0 330 38 L 0 38 Z" fill="url(#purpleGrad)" fill-opacity="0.25" />
    <text x="20" y="25" fill="#bc8cff" font-size="15" font-weight="700">TIER 3: Cognitive &amp; Math Engine</text>

    <!-- Component 1: Geometric Core -->
    <rect x="15" y="50" width="300" height="75" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="25" y="70" fill="#f0f6fc" font-size="12" font-weight="600">1. Geometric Perception</text>
    <text x="25" y="88" fill="#bc8cff" font-size="10">EAR: 6-point Eye Aspect Ratio (Blink &lt; 0.21)</text>
    <text x="25" y="103" fill="#8b949e" font-size="10">PERCLOS: Rolling 60s Percentage Eye Closure</text>
    <text x="25" y="117" fill="#8b949e" font-size="10">MAR: Mouth Aspect Ratio (Yawn &amp; Speech Dynamics)</text>

    <!-- Component 2: 3D Pose -->
    <rect x="15" y="135" width="300" height="75" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="25" y="155" fill="#f0f6fc" font-size="12" font-weight="600">2. 3D Head Pose (PnP Matrix)</text>
    <text x="25" y="173" fill="#bc8cff" font-size="10">DACE Euler Matrix: Pitch (–down), Yaw, Roll</text>
    <text x="25" y="188" fill="#8b949e" font-size="10">Per-Track Baseline Calibration Reference</text>
    <text x="25" y="203" fill="#8b949e" font-size="10">Fidget Velocity: Σ(|Δyaw| + |Δpitch| + |Δroll|)</text>

    <!-- Component 3: Context-Gate -->
    <rect x="15" y="220" width="300" height="80" rx="6" fill="#21262d" stroke="#8957e5" stroke-width="1" />
    <text x="25" y="240" fill="#f0f6fc" font-size="12" font-weight="600">3. Context-Gate Override Logic</text>
    <text x="25" y="258" fill="#e6edf3" font-size="10">Resolves Reading vs. Phone Ambiguity</text>
    <text x="25" y="273" fill="#8b949e" font-size="10">Hand-to-Ear / Hand-to-Face Distance Metric</text>
    <text x="25" y="288" fill="#8b949e" font-size="10">Prevents False Drowsiness Flag during Downward Reading</text>

    <!-- Component 4: Temporal Behavior -->
    <rect x="15" y="310" width="300" height="80" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="25" y="330" fill="#f0f6fc" font-size="12" font-weight="600">4. Temporal 1D-CNN / MLP Classifier</text>
    <text x="25" y="348" fill="#bc8cff" font-size="10">15-dimensional Feature Representation</text>
    <text x="25" y="363" fill="#8b949e" font-size="10">5 Hz Rolling Window (3-second receptive field)</text>
    <text x="25" y="378" fill="#8b949e" font-size="10">Classes: Focused • Distracted • Drowsy • Wandering</text>

    <!-- Component 5: Statistical Fusion -->
    <rect x="15" y="400" width="300" height="75" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="25" y="420" fill="#f0f6fc" font-size="12" font-weight="600">5. Statistical Trend &amp; Fusion</text>
    <text x="25" y="438" fill="#bc8cff" font-size="10">EMA Smoothing: St = α·Sraw + (1–α)·St–1 (α=0.15)</text>
    <text x="25" y="453" fill="#8b949e" font-size="10">OLS Fatigue Regression: β &lt; –0.4 (R² &gt; 0.35)</text>
    <text x="25" y="468" fill="#8b949e" font-size="10">CMCV Cross-Modal Consistency Validation</text>

    <rect x="15" y="488" width="300" height="42" rx="6" fill="#8957e5" fill-opacity="0.15" stroke="#8957e5" stroke-width="1" />
    <text x="25" y="506" fill="#bc8cff" font-size="11" font-weight="600">Standardized Cross-Platform JSON</text>
    <text x="25" y="522" fill="#8b949e" font-size="10">v1.0 &amp; v2.0 Shared Numerical Contract (encode15_v2)</text>
  </g>

  <!-- TIER 4: HARDWARE EXTENSION (ESP32) -->
  <g transform="translate(760, 95)" filter="url(#cardShadow)">
    <rect width="300" height="545" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 288 0 Q 300 0 300 38 L 0 38 Z" fill="url(#orangeGrad)" fill-opacity="0.25" />
    <text x="20" y="25" fill="#ffa657" font-size="15" font-weight="700">TIER 4: ESP32 Actuation Hub</text>

    <!-- Sub-boxes -->
    <rect x="15" y="50" width="270" height="50" rx="6" fill="#21262d" stroke="#ffa657" stroke-width="1" />
    <text x="25" y="70" fill="#e6edf3" font-size="12" font-weight="600">Hardware Serial / REST Bridge</text>
    <text x="25" y="86" fill="#8b949e" font-size="10">115200 Baud UART • HTTP REST :8080</text>

    <rect x="15" y="110" width="270" height="120" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="25" y="130" fill="#f0f6fc" font-size="12" font-weight="600">4-Channel Relay Opto-Isolated</text>
    <text x="25" y="148" fill="#ffa657" font-size="10">CH1 (GPIO 18): Task Lighting / Buzzer</text>
    <text x="25" y="165" fill="#3fb950" font-size="10">CH2 (GPIO 19): Ventilation / AC Blast</text>
    <text x="25" y="182" fill="#58a6ff" font-size="10">CH3 (GPIO 21): Desk Circulator / Interlock</text>
    <text x="25" y="199" fill="#bc8cff" font-size="10">CH4 (GPIO 22): Focus Beacon / Warning Lamp</text>
    <text x="25" y="216" fill="#8b949e" font-size="9">Optocoupled Isolation • Active-LOW Safe Failover</text>

    <rect x="15" y="240" width="270" height="145" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="25" y="260" fill="#f0f6fc" font-size="12" font-weight="600">Dynamic Operating Modes</text>
    <text x="25" y="278" fill="#e6edf3" font-size="10">• Mode: proto (Study Desk &amp; Classroom)</text>
    <text x="25" y="295" fill="#e6edf3" font-size="10">• Mode: truck (Fleet &amp; Heavy Machinery)</text>
    <text x="25" y="312" fill="#e6edf3" font-size="10">• Mode: exam (Testing Hall &amp; Proctor Kiosk)</text>
    <text x="25" y="329" fill="#e6edf3" font-size="10">• Mode: cleanroom (Sterile Bio-Lab)</text>
    <text x="25" y="352" fill="#ffa657" font-size="9">Instant State Transitions via Cognitive Thresholds</text>

    <rect x="15" y="395" width="270" height="135" rx="6" fill="#ffa657" fill-opacity="0.1" stroke="#ffa657" stroke-width="1" />
    <text x="25" y="415" fill="#ffa657" font-size="12" font-weight="600">Fail-Safe Hardware Protections</text>
    <text x="25" y="433" fill="#8b949e" font-size="10">• Hardware Watchdog Timer (WDT)</text>
    <text x="25" y="450" fill="#8b949e" font-size="10">• Non-blocking millis() Pulse Timeout</text>
    <text x="25" y="467" fill="#8b949e" font-size="10">• Optical Isolation across Relay VCC/JD-VCC</text>
    <text x="25" y="484" fill="#8b949e" font-size="10">• Disconnect Fallback: Safe Default State</text>
    <text x="25" y="508" fill="#f0f6fc" font-size="10" font-weight="600">Response Latency: &lt; 25 ms</text>
  </g>

  <!-- Connectors -->
  <!-- Tier 1 to Tier 3 -->
  <path d="M 350 220 L 390 220" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowBlue)" />
  <text x="370" y="210" fill="#58a6ff" font-size="9" text-anchor="middle">200ms</text>

  <!-- Tier 2 to Tier 3 -->
  <path d="M 350 510 L 390 510" stroke="#3fb950" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowGreen)" />
  <text x="370" y="500" fill="#3fb950" font-size="9" text-anchor="middle">5 Hz</text>

  <!-- Tier 3 to Tier 4 -->
  <path d="M 720 365 L 760 365" stroke="#ffa657" stroke-width="2.5" marker-end="url(#arrowOrange)" />
  <text x="740" y="355" fill="#ffa657" font-size="9" text-anchor="middle">Actuation</text>

  <!-- Footer credits -->
  <text x="550" y="665" text-anchor="middle" fill="#8b949e" font-size="11">AttentionTrackerOSS • Open Source Cognitive Engagement System • Lead Developer: Hrishikesh Jha</text>
</svg>
