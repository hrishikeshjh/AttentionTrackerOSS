name: CI

# Runs on every push to main (as requested) and on PRs targeting main, so
# problems are caught before merge, not just after. Jobs are path-filtered
# (via the `changes` job below) so a v1.0-only change doesn't waste time
# running v2.0 jobs and vice versa -- see the `changes` job's outputs and
# each downstream job's `if:` condition.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# pull-requests: read is required on PR runs: dorny/paths-filter lists the PR's
# changed files and gitleaks-action lists the PR's commits through the GitHub
# API; without it both fail with "403 Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Path detection (drives which jobs below actually run) ──────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      v1: ${{ steps.filter.outputs.v1 }}
      v2: ${{ steps.filter.outputs.v2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            v1:
              - 'v1.0/**'
            v2:
              - 'v2.0/**'

  # ── v1.0 (Next.js / TypeScript) ──────────────────────────────────────────────
  v1-typecheck:
    needs: changes
    if: needs.changes.outputs.v1 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v1.0/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  v1-lint:
    needs: changes
    if: needs.changes.outputs.v1 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v1.0/package-lock.json
      - run: npm ci
      - run: npm run lint

  v1-test:
    needs: changes
    if: needs.changes.outputs.v1 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v1.0/package-lock.json
      - run: npm ci
      - run: npx vitest run

  v1-build:
    needs: changes
    if: needs.changes.outputs.v1 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v1.0/package-lock.json
      - run: npm ci
      # NEXT_PUBLIC_FIREBASE_* aren't secret (see src/lib/firebase.ts) --
      # dummy values here are enough for the build to succeed; real values
      # are only needed at runtime for actual Firebase calls to work.
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:0"

  v1-audit:
    needs: changes
    if: needs.changes.outputs.v1 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v1.0/package-lock.json
      - run: npm ci
      # Informational, not a merge gate: advisories are published daily, so a
      # blocking audit turns red with no code change. Remaining findings are
      # transitive (e.g. @grpc/grpc-js via firebase/genkit) with no upstream
      # fix. Review the output; fix via `npm audit fix` / dependency bumps.
      - run: npm audit --audit-level=high
        continue-on-error: true

  # ── v2.0 (Python / FastAPI) ───────────────────────────────────────────────────
  v2-lint:
    needs: changes
    if: needs.changes.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      # ruff format --check is deliberately NOT run here: this codebase
      # uses intentional visual alignment in tabular data structures
      # (e.g. training/penalty_matrix.py, realistic_synthetic_loader.py's
      # _SPECS table) that Black-style auto-formatting would destroy.
      # Linting (real bugs: unused imports, undefined names) is enforced;
      # formatting style is not.
      - run: ruff check .

  v2-typecheck:
    needs: changes
    if: needs.changes.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install mypy
      # Informational, not a merge gate: this is the first mypy pass on a
      # previously untyped-by-tool codebase. ~30 pre-existing findings
      # remain (lazy-init "declare as None, assign real object later"
      # patterns across 3+ files, and a couple of dict-value-type
      # inference limits) -- verified individually to be benign, not
      # bugs, during the pass that added this config. Fixing them requires
      # a structural refactor (e.g. Optional-typed lazy fields with
      # explicit narrowing) that's a separate, larger effort. New code
      # should still aim to be mypy-clean; this job surfaces regressions
      # without blocking merges on the pre-existing backlog.
      - run: mypy .
        continue-on-error: true

  v2-test:
    needs: changes
    if: needs.changes.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Lightweight tier only: numpy/pytest/scikit-learn, no torch/opencv/
      # ultralytics/mediapipe/shapely/fastapi. Installing the full ML stack
      # (multi-GB, several minutes) for CI is a separate, heavier addition
      # not in scope here -- test_tracking.py and test_v2_pipeline.py need
      # it and are excluded; everything else (feature encoding, penalty
      # matrix, temporal consistency, train/val split, CVAT conversion,
      # v1 pipeline logic) runs on this lightweight tier.
      - run: pip install numpy pytest scikit-learn
      - run: pytest tests/ --ignore=tests/test_tracking.py --ignore=tests/test_v2_pipeline.py -v

  v2-audit:
    needs: changes
    if: needs.changes.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      # --no-deps --disable-pip audits the pinned versions as written instead
      # of resolving them: server/requirements.txt is not currently
      # resolvable (boxmot==10.0.43 pins numpy==1.23.1, conflicting with
      # numpy==1.26.4), which made pip-audit abort before auditing anything.
      # Informational, not a merge gate: the pins have known advisories
      # (pillow, onnx, scikit-learn, pytest, python-dotenv); bumping them
      # needs a smoke test of the ML stack, so it is tracked separately.
      - run: pip-audit --no-deps --disable-pip -r server/requirements.txt
        continue-on-error: true

  # ── Repo-wide ─────────────────────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Single required status check ─────────────────────────────────────────────
  # Point branch protection at this one job instead of listing every job
  # above individually -- it passes iff every job that actually ran
  # succeeded (skipped jobs, e.g. v1 jobs on a v2.0-only change, don't
  # count as failures).
  all-checks-passed:
    if: always()
    needs:
      - v1-typecheck
      - v1-lint
      - v1-test
      - v1-build
      - v1-audit
      - v2-lint
      - v2-typecheck
      - v2-test
      - v2-audit
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e \
            'to_entries | all(.value.result == "success" or .value.result == "skipped")'
